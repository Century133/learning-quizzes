<script>
function lqB(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function lqKey(){
  const m = /[#&]k=([A-Za-z0-9_-]{40,})/.exec(location.hash);
  if(m){ try{ localStorage.setItem('lq:key', m[1]); }catch(e){}
         history.replaceState(null, '', location.pathname + location.search); }
  try{ return localStorage.getItem('lq:key') || ''; }catch(e){ return ''; }
}
// The link opened in a tab already on this page is a hash change, which does not reload.
addEventListener('hashchange', ()=>{ if(/[#&]k=/.test(location.hash)) location.reload(); });
async function lqOpen(sealed){
  const k = lqKey();
  if(!k || !sealed) return null;
  try{
    const p = sealed.split('.');
    const ck = await crypto.subtle.importKey('raw', lqB(k), 'AES-GCM', false, ['decrypt']);
    const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:lqB(p[0])}, ck, lqB(p[1]));
    return new TextDecoder().decode(out);
  }catch(e){ return null; }
}

(async()=>{
  const html = await lqOpen(document.getElementById('sealed').textContent.trim());
  if(html === null){
    document.getElementById('m').innerHTML = 'This page is private.<br>'
      + 'Open your unlock link once on this device.';
    return;
  }
  document.open(); document.write(html); document.close();
  // the tab kept saying "Locked": name it from the page that was just drawn
  const t = /<title>([^<]*)<\/title>/.exec(html);
  if(t){ const d = document.createElement('textarea'); d.innerHTML = t[1]; document.title = d.value; }
})();
</script></body></html>
