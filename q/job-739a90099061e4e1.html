<script>
function lqB(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function lqKey(){
  const m = /[#&]k=([A-Za-z0-9_-]{40,})/.exec(location.hash);
  if(m){ try{ localStorage.setItem('lq:key', m[1]); }catch(e){}
         history.replaceState(null, '', location.pathname + location.search); }
  try{ return localStorage.getItem('lq:key') || ''; }catch(e){ return ''; }
}
// The link opened in a tab already on this page is a hash change, which does not reload.
addEventListener('hashchange', ()=>{ if(/[#&]k=/.test(location.hash)) location.reload(); });
async function lqOpen(sealed){
  const k = lqKey();
  if(!k || !sealed) return null;
  try{
    const p = sealed.split('.');
    const ck = await crypto.subtle.importKey('raw', lqB(k), 'AES-GCM', false, ['decrypt']);
    const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:lqB(p[0])}, ck, lqB(p[1]));
    return new TextDecoder().decode(out);
  }catch(e){ return null; }
}


(function(){
  if(window.lqSync) return;
  const API = 'https://terp-plate.vercel.app/api/quiz-sync', MK = 'lqsync:meta';
  const none = {first: Promise.resolve([]), now: async()=>[], listen(){}};
  let key = '';
  try{ key = localStorage.getItem('lq:key') || ''; }catch(e){}
  const hm = /[#&]k=([A-Za-z0-9_-]{40,})/.exec(location.hash);
  if(hm) key = hm[1];
  if(!key || !window.crypto || !crypto.subtle){ window.lqSync = none; return; }

  const skip = k => k.indexOf('lq:') !== 0 || k === 'lq:key' || k === 'lq:speech';
  const rawSet = Storage.prototype.setItem;
  let meta = {};
  try{ meta = JSON.parse(localStorage.getItem(MK) || '{}') || {}; }catch(e){}
  const putMeta = ()=>{ try{ rawSet.call(localStorage, MK, JSON.stringify(meta)); }catch(e){} };
  const hash = t => { let h = 5381; for(let i=0;i<t.length;i++) h = ((h<<5) + h + t.charCodeAt(i)) | 0; return h; };
  const isState = k => /^lq:[^:]+$/.test(k) && k !== 'lq:hub';
  function weight(s){
    return Object.keys(s.answers||{}).length + Object.keys(s.pass2||{}).length
         + Object.keys(s.skipped||{}).length + Object.keys(s.starred||{}).length
         + Object.keys(s.unsure||{}).length + 1000 * (s.history||[]).length + (s.done ? 500 : 0);
  }
  // '' = nothing worth sending
  function sig(k, v){
    if(isState(k)){
      try{ const s = JSON.parse(v);
        if(!s || typeof s !== 'object') return '';
        if(!weight(s) && !s.only && !s.tagf) return '';
        const c = Object.assign({}, s); delete c.ms; delete c.qms; delete c.meta; delete c.hintOpen;
        return JSON.stringify(c);
      }catch(e){ return ''; }
    }
    return (v && v !== '{}' && v !== '[]' && v !== '{"defs":[],"q":{}}') ? v : '';
  }
  let frozen = false, applying = false, timer = null, busy = false;
  function mark(k, v){
    if(skip(k)) return;
    const g = sig(k, v), h = hash(g), m = meta[k] || (meta[k] = {t:0});
    if(m.h === h) return;
    m.h = h;
    if(g){ m.t = Date.now(); m.d = 1; clearTimeout(timer); timer = setTimeout(run, 1500); }
    putMeta();
  }
  Storage.prototype.setItem = function(k, v){
    if(this === localStorage && frozen && String(k).indexOf('lq:') === 0) return;
    rawSet.call(this, k, v);
    if(this === localStorage && !applying){ try{ mark(String(k), String(v)); }catch(e){} }
  };
  // What was already here before sync existed: age unknown, so it is stamped low, and a real
  // attempt outranks a thinner one by how much is in it.
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(skip(k) || meta[k]) continue;
      const v = localStorage.getItem(k), g = sig(k, v);
      meta[k] = {t: 0, h: hash(g)};
      if(g){ let w = 1; if(isState(k)){ try{ w = 1 + weight(JSON.parse(v)); }catch(e){} }
             meta[k].t = w; meta[k].d = 1; }
    }
    putMeta();
  }catch(e){}

  const enc = new TextEncoder(), dec = new TextDecoder();
  const toB = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
                     return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const fromB = u => { let t = ''; for(let i=0;i<u.length;i+=8192) t += String.fromCharCode.apply(null, u.subarray(i, i+8192));
                       return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
  let ck = null, bucket = '';
  const ready = (async()=>{
    ck = await crypto.subtle.importKey('raw', toB(key), 'AES-GCM', false, ['encrypt','decrypt']);
    bucket = hex(await crypto.subtle.digest('SHA-256', enc.encode('lq-sync:' + key))).slice(0, 32);
  })();
  const kid = async k => hex(await crypto.subtle.digest('SHA-256', enc.encode(bucket + '|' + k))).slice(0, 32);
  async function seal(o){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, ck, enc.encode(JSON.stringify(o)));
    return fromB(iv) + '.' + fromB(new Uint8Array(ct));
  }
  async function unseal(t){
    const p = t.split('.');
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:toB(p[0])}, ck, toB(p[1]))));
  }

  function pageId(){
    const el = document.getElementById('quiz-data');
    if(!el) return null;
    try{ return JSON.parse(el.textContent).id; }catch(e){ return null; }
  }
  async function run(){
    if(busy || frozen) return [];
    busy = true;
    const changed = [];
    try{
      await ready;
      const have = {}, puts = [], sent = {};
      for(const k of Object.keys(meta)){
        const m = meta[k];
        if(!m.id) m.id = await kid(k);
        have[m.id] = m.t || 0;
        if(m.d){
          const v = localStorage.getItem(k);
          if(v === null){ m.d = 0; continue; }
          puts.push({k: m.id, v: await seal({k, v}), ts: m.t});
          sent[k] = m.t;
        }
      }
      const r = await fetch(API, {method:'POST', headers:{'content-type':'text/plain'},
                                  body: JSON.stringify({bucket, have, puts})});
      if(!r.ok) throw new Error('sync ' + r.status);
      const j = await r.json();
      for(const k in sent) if(meta[k].t === sent[k]) meta[k].d = 0;
      for(const row of j.rows || []){
        let o; try{ o = await unseal(row.v); }catch(e){ continue; }
        if(!o || skip(o.k)) continue;
        const m = meta[o.k] || (meta[o.k] = {t:0});
        if((m.t || 0) >= row.ts) continue;
        applying = true;
        try{ rawSet.call(localStorage, o.k, o.v); }catch(e){}
        applying = false;
        m.t = row.ts; m.d = 0; m.h = hash(sig(o.k, o.v)); m.id = row.k;
        changed.push(o.k);
      }
      putMeta();
    }catch(e){}
    busy = false;
    if(changed.length && window.lqSync.live){
      const id = pageId();
      const mine = id ? changed.some(k => k === 'lq:' + id || k.indexOf('lq:' + id + ':') === 0)
                      : !!document.getElementById('manifest');
      if(mine){ frozen = true; location.reload(); }
    }
    return changed;
  }
  function wake(){ if(document.visibilityState !== 'hidden') run(); }
  function leave(){ if(document.visibilityState === 'hidden') run(); }
  function listen(){
    document.removeEventListener('visibilitychange', wake); document.addEventListener('visibilitychange', wake);
    document.removeEventListener('visibilitychange', leave); document.addEventListener('visibilitychange', leave);
    removeEventListener('focus', wake); addEventListener('focus', wake);
  }
  // `live` = this page should reload itself when its own quiz arrives newer. The locked shell
  // turns it on only after it has drawn the page.
  window.lqSync = {first: null, now: run, listen, live: true};
  listen();
  setInterval(wake, 20000);
  window.lqSync.first = run();
})();

(async()=>{
  // his other device may be further along: fetch that BEFORE the page reads its saved attempt
  window.lqSync.live = false;
  await Promise.race([window.lqSync.first, new Promise(r => setTimeout(r, 4000))]);
  const html = await lqOpen(document.getElementById('sealed').textContent.trim());
  if(html === null){
    document.getElementById('m').innerHTML = 'This page is private.<br>'
      + 'Open your unlock link once on this device.';
    return;
  }
  document.open(); document.write(html); document.close();
  // the tab kept saying "Locked": name it from the page that was just drawn
  const t = /<title>([^<]*)<\/title>/.exec(html);
  if(t){ const d = document.createElement('textarea'); d.innerHTML = t[1]; document.title = d.value; }
  window.lqSync.live = true; window.lqSync.listen();
})();
</script></body></html>
