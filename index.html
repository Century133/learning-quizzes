<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131314">
<title>My quizzes</title>
<style>
:root{--bg:#131314;--surface:#1e1f20;--surface-hi:#2a2b2d;--text:#e3e3e3;
--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--right:#81c995;--wrong:#f28b82;
--radius:16px;--maxw:760px;--qsize:1.75rem;--font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);
 font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
 min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--accent)}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---- top bar: title, tabs, progress. Nothing else lives up here. ---- */
header{position:sticky;top:0;z-index:5;background:var(--bg);
 border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:56px}
.title{font-size:.95rem;font-weight:500;letter-spacing:.01em;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;flex:1}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;
 padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface-hi);color:var(--text)}
.rail{height:2px;background:var(--line)}
.rail>i{display:block;height:100%;background:var(--accent);width:0;
 transition:width .25s ease}

main{flex:1;display:flex;flex-direction:column;justify-content:center;
 padding:40px 0 24px}
.q{font-size:var(--qsize);line-height:1.35;font-weight:400;margin:0 0 32px;
 letter-spacing:-.01em}

/* ---- options ---- */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
 background:var(--surface);border:1px solid transparent;border-radius:var(--radius);
 padding:18px 20px;color:var(--text);font:inherit;cursor:pointer;
 transition:background .12s ease,border-color .12s ease}
.opt:hover:not(:disabled){background:var(--surface-hi)}
.opt:disabled{cursor:default}
.opt .k{color:var(--muted);min-width:1.2em;font-variant-numeric:tabular-nums}
.opt .t{flex:1}
.opt .mark{font-size:1.1rem;line-height:1.4;opacity:0;min-width:1.1em;text-align:right}

/* GRAYSCALE-SAFE STATES.
   Three signals, never colour alone: a glyph, a word (in .verdict), and luminance —
   the right answer goes BRIGHT with a solid border, a wrong pick goes DIM with a dashed
   one. Turn the display to grayscale and all of it still reads. */
.opt.is-right{background:var(--surface-hi);border-color:var(--right);
 box-shadow:inset 0 0 0 1px var(--right)}
.opt.is-right .mark{opacity:1;color:var(--right)}
.opt.is-wrong{background:transparent;border-style:dashed;border-color:var(--wrong);
 opacity:.72}
.opt.is-wrong .mark{opacity:1;color:var(--wrong)}
.opt.is-muted{opacity:.45}

.verdict{display:flex;align-items:center;gap:10px;margin:26px 0 0;
 font-size:.95rem;font-weight:500}
.verdict .g{font-size:1.15rem}
.why{margin:10px 0 0;color:var(--muted);font-size:.95rem;line-height:1.6}
/* the sticky footer floats over the end of the text, so anything we scroll to has to
   reserve room for it or the last line lands underneath the buttons */
.verdict,.why{scroll-margin-bottom:104px}
.topic{margin:8px 0 0;font-size:.78rem;color:var(--muted);letter-spacing:.06em;
 text-transform:uppercase}

/* ---- bottom bar ---- */
footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);
 padding:16px 0 24px}
.acts{display:flex;gap:12px;align-items:center}
.spacer{flex:1}
button.pill{font:inherit;font-size:.95rem;border-radius:999px;padding:12px 26px;
 cursor:pointer;border:1px solid var(--line);background:none;color:var(--text)}
button.pill:disabled{opacity:.35;cursor:default}
button.pill.primary{background:var(--accent);color:#0b0b0c;border-color:var(--accent);
 font-weight:500}
button.pill.ghost{border-color:transparent;color:var(--muted)}

/* ---- end card ---- */
.score{font-size:3.5rem;font-weight:400;letter-spacing:-.03em;margin:0}
.score small{font-size:1rem;color:var(--muted);font-weight:400;letter-spacing:0}
.sub{color:var(--muted);margin:6px 0 30px}
.chart{display:flex;height:12px;border-radius:999px;overflow:hidden;
 background:var(--line);margin:0 0 10px}
.chart i{display:block;height:100%}
.chart i.r{background:var(--right)}
/* the wrong slice is hatched as well as coloured, so the split reads in grayscale */
.chart i.w{background:var(--wrong);
 background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,
 rgba(0,0,0,.45) 3px,rgba(0,0,0,.45) 6px)}
.legend{display:flex;gap:18px;color:var(--muted);font-size:.85rem;margin:0 0 34px}
.legend b{color:var(--text);font-weight:500}
.topics{margin:0 0 34px}
.topics h3,.rev h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
 color:var(--muted);font-weight:500;margin:0 0 14px}
.trow{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
 padding:9px 0;border-top:1px solid var(--line)}
.trow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.tbar{grid-column:1/-1;height:4px;background:var(--line);border-radius:999px;
 overflow:hidden}
.tbar i{display:block;height:100%;background:var(--text)}

/* ---- review list ---- */
.rev{padding:8px 0 40px}
.item{border-top:1px solid var(--line);padding:22px 0}
.item .qq{font-size:1.05rem;margin:0 0 14px}
.line{display:flex;gap:10px;align-items:flex-start;padding:3px 0;font-size:.95rem}
.line .g{min-width:1.2em}
.line.mine{color:var(--muted)}
.line.ok{color:var(--text)}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
 color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;
 margin:0 0 10px}

/* ---- study sheet ---- */
.sheet{padding:8px 0 60px;font-size:1rem}
.sheet h2{font-size:1.35rem;font-weight:500;margin:36px 0 12px;letter-spacing:-.01em}
.sheet h3{font-size:1.05rem;font-weight:500;margin:26px 0 8px}
.sheet h4,.sheet h5{font-size:.95rem;font-weight:500;margin:20px 0 6px;color:var(--muted)}
.sheet p{margin:0 0 12px}
.sheet ul,.sheet ol{margin:0 0 14px;padding-left:22px}
.sheet li{margin:0 0 6px}
.sheet strong{font-weight:600}
.sheet hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.sheet code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.9em}

.hist{color:var(--muted);font-size:.85rem;margin:26px 0 0}
.hist span{white-space:nowrap}
.note{color:var(--muted);font-size:.85rem;margin:18px 0 0}
.hide{display:none !important}

@media (max-width:640px){
  .wrap{padding:0 18px}
  .q{font-size:1.35rem;margin-bottom:24px}
  main{padding:26px 0 16px}
  .opt{padding:15px 16px}
  .score{font-size:2.75rem}
  .bar{height:52px;gap:10px}
  .tab{padding:6px 11px}
  button.pill{padding:12px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}


.head{padding:56px 0 34px}
.head h1{font-size:2rem;font-weight:400;letter-spacing:-.02em;margin:0}
.head p{color:var(--muted);margin:8px 0 0}
.book{margin:0 0 40px}
.book h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
 font-weight:500;margin:0 0 4px}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;
 border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover .nm{color:var(--accent)}
.nm{flex:1;font-size:1.02rem}
.nm small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.badge{font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap;
 border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.badge.done{border-color:var(--text)}
.badge.none{color:var(--muted)}
.mini{width:70px;height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--text)}
.empty{color:var(--muted);padding:30px 0}
.foot{color:var(--muted);font-size:.85rem;padding:10px 0 60px;border-top:1px solid var(--line)}
@media (max-width:640px){
  .head{padding:34px 0 24px}
  .mini{display:none}
  .row{gap:12px}
}

</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>My quizzes</h1>
    <p id="tally"></p>
  </div>
  <div id="list"></div>
  <p class="foot">Scores are saved in this browser. A quiz taken on your phone keeps its
  own history there.</p>
</main>
<script id="manifest" type="application/json">[{"id": "test-render", "title": "Test — the look", "subtitle": "Pilot render check", "book": "Test", "url": "q/test-render.html", "total": 3}, {"id": "psp-3-6", "title": "3.6 How to Feel Better: Coping With Negative Emotions", "subtitle": "Chapter 3 · Social Affect", "book": "PSP", "url": "q/psp-3-6.html", "total": 10}]</script>
<script>
const M = JSON.parse(document.getElementById('manifest').textContent);
const esc = t => { const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; };

function state(id){
  try{ return JSON.parse(localStorage.getItem('lq:'+id) || 'null'); }catch(e){ return null; }
}
function when(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

const books = {};
M.forEach(q => { (books[q.book] = books[q.book] || []).push(q); });

let taken = 0, total = 0;
let h = '';
Object.keys(books).forEach(b => {
  h += '<div class="book"><h2>' + esc(b) + '</h2>';
  books[b].forEach(q => {
    const s = state(q.id);
    const done = s && s.done;
    const n = done ? (s.meta ? s.meta.score : 0) : 0;
    const t = q.total;
    if(done) taken++;
    total++;
    const tries = s && s.history ? s.history.length + (done ? 1 : 0) : 0;
    let sub = q.subtitle || '';
    if(done){
      sub = when(s.at) + (tries > 1 ? ' · ' + tries + ' attempts' : '') + (sub ? ' · ' + sub : '');
    } else if(s && Object.keys(s.answers||{}).length){
      sub = 'In progress — ' + Object.keys(s.answers).length + ' of ' + t + (sub ? ' · ' + sub : '');
    }
    h += '<a class="row" href="' + q.url + '">'
       + '<span class="nm">' + esc(q.title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>'
       + (done ? '<span class="mini"><i style="width:' + (n/t*100) + '%"></i></span>' : '')
       + '<span class="badge ' + (done ? 'done' : 'none') + '">'
       + (done ? n + ' / ' + t : 'Not taken') + '</span></a>';
  });
  h += '</div>';
});

document.getElementById('list').innerHTML = h || '<p class="empty">Nothing built yet.</p>';
document.getElementById('tally').textContent =
  total ? taken + ' of ' + total + ' taken in this browser' : '';
</script>
</body>
</html>
