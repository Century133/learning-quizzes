<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131314">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>My quizzes</title>
<style>
:root{--bg:#131314;--surface:#1e1f20;--surface-hi:#26282a;--text:#e3e3e3;
--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--right:#81c995;--wrong:#f28b82;
--radius:14px;--maxw:660px;--qsize:1.25rem;--font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);
 font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
 min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--accent)}
/* Longhands, NOT `padding:0 22px`. `main` and `footer` also carry .wrap, and a class beats
   an element selector — the shorthand here was silently zeroing their vertical padding. */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;
 padding-left:22px;padding-right:22px}

/* ---- top bar: title, tabs, progress. Nothing else lives up here. ---- */
header{position:sticky;top:0;z-index:5;background:var(--bg);
 border-bottom:1px solid var(--line)}
/* THE BAR IS WIDER THAN THE COLUMN, and that is what makes a centred title possible at all.
   The reading column is 660px and the tab strip is ~300 of it once an exam shows Starred and
   Written — so inside the column there is no width at which a real title can be centred with
   the tabs still on the row. Letting only the bar run to 1080 pushes the tabs out to the
   window and leaves the middle free. THE CENTRE IS UNCHANGED by this: the bar, the rail, the
   band and the card are all centred on the same axis, so the title still lines up with the
   question under it — only the tabs moved outward. */
.bar{display:flex;align-items:center;gap:14px;height:var(--barh);position:relative;
 max-width:min(1080px, 100%)}
/* DEAD-CENTRE WHENEVER IT FITS (08-12, his ask), and centred in the space beside the tabs
   when it does not. The fallback is not caution: the column is 660px, the tabs eat ~235 of
   it, and dead-centre needs an empty gutter the same width on the left — which leaves about
   120px for the title, and "3.6 How to Feel Better: Coping With Negative Emotions" is 360.
   Truncating every long title to centre it would be a worse page than an off-centre one.
   `fitTitle()` measures both and adds .mid only when the real title clears the real tabs. */
.title{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;flex:1;text-align:center}
/* THE CLOCK IS MIST UNTIL HE ASKS (08-18, his second pass at it). *"make it like of mistty
   and blurry at the top and an unhide button which shows it, but I also like the hotkey w."*

   BLURRED, NOT HIDDEN, and that is the whole design. Hiding it made the bar move every time
   he pressed `w`, and — worse — the press stuck, so a quiz he had once been curious about
   showed him a running clock for the rest of the paper. A blur costs the same pixels either
   way: nothing in the row moves, and there is always something there to click.

   IT IS THE BUTTON. There is no separate control, because a control beside an unreadable
   smudge is two things where one will do — press `w`, or click the smudge.

   `tabindex="-1"` IS LOAD-BEARING: it keeps the clock out of the tab order, so Enter — which
   means "next question" everywhere on this page — can never land on it and toggle instead.

   A REAL <button> ALSO MEANS THE READER SKIPS IT FOR FREE: `button` is on NaturalReader's
   ignore list, so this is silent even before the `.no-read-aloud` class it also carries.
   He asked for that explicitly, and a number that changes every second is the worst thing a
   page reader could be handed. */
.clock{flex:0 0 auto;min-width:3.4em;background:none;border:0;padding:0;text-align:left;
 font:inherit;font-size:.78rem;color:var(--muted);
 font-variant-numeric:tabular-nums;letter-spacing:.04em;cursor:pointer;
 user-select:none;-webkit-user-select:none;
 filter:blur(4px);opacity:.45;transition:filter .18s ease,opacity .18s ease}
.clock:hover{opacity:.75}
.clock.on{filter:none;opacity:1;cursor:pointer}
/* Out of the flex row and centred on the bar's padding box — the same box the rail spans,
   so the title lines up with the progress track under it and with the band below that. */
.bar.mid .title{position:absolute;left:0;right:0;margin:0 auto;width:max-content;
 max-width:100%;flex:none}
.bar.mid .tabs{margin-left:auto}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;
 padding:5px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface-hi);color:var(--text)}
/* END CAPS, because a grey line on a grey page has no visible extent — "hard to see the
   defined start and end". Two short uprights mark where the quiz begins and ends, so the
   blue fill is read against a track with edges rather than against the whole window. They
   are luminance, not colour, so they survive grayscale like the rest of the page. */
.rail{height:2px;background:var(--line);position:relative}
.rail::before,.rail::after{content:"";position:absolute;top:-3px;width:2px;height:8px;
 background:var(--muted);border-radius:1px}
.rail::before{left:0}
.rail::after{right:0}
.rail>i{display:block;height:100%;background:var(--accent);width:0;
 transition:width .25s ease}

/* TOP-ANCHORED, NOT CENTRED, and that is a fix rather than a preference. With
   justify-content:center the question drifted upward the moment an answer opened a
   rationale, because the block got taller and the centring recomputed — "the question
   shifts… it should stay stationary". Anchored to the top it cannot move: only the cards
   below the one he clicked ever change position. */
main{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:16px 0 6px}

/* ---- THE BAND ----
   Flat black under the question made it hard to read; the notebook's lighter middle band is
   what he wanted instead. So the question and EVERY option sit inside one surface.

   IT CLOSES AT THE BOTTOM AND HUGS THE CONTENT. The first version ran off the bottom of the
   screen — "kind of weirdly big at the bottom", and he was right: with the block centred, an
   open band left a lot of empty surface under the last option. It is a card now, sized to
   what is in it.

   THREE TONES, and the order matters: page (--bg) → band (--band) → option card (--surface).
   Set --band lighter than --surface and the cards vanish into it. */
.band{background:var(--band);border:1px solid var(--line);border-radius:var(--bandr);
 padding:var(--bandpad)}
/* Off for the end card, the review list and the sheet — a long scrolling list does not want
   to be in a box. */
.band.off{background:none;border:0;padding:0}
/* A short window pays for the band's padding out of the space the options need, so it gives
   most of it back below 780px. Measured: at 800px all 14 questions of PSP 3.6 still fit
   answered-wrong with no scrolling. */
@media (max-height:780px){
  .band{padding:12px 16px}
}

/* ---- the question ---- */
.qhead{display:flex;align-items:flex-start;gap:10px;margin:0 0 var(--qgap)}
.qhead .qcol{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:.7rem;
 color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.meta .num{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.meta .dot{opacity:.55}
.topic{margin:0 0 6px;font-size:.7rem;color:var(--muted);letter-spacing:.07em;
 text-transform:uppercase}
.q{font-size:var(--qsize);line-height:1.35;font-weight:var(--qweight);margin:0;
 letter-spacing:-.005em}
.link{background:none;border:0;padding:0;color:var(--muted);font:inherit;
 font-size:.85rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--text)}
/* The hint lives in the FOOTER, as Gemini's does. Opening it there grows the sticky bar
   upward and leaves the question and every option exactly where they were; under the
   question it would have shoved all four cards down. */
.hinttext{margin:0 0 12px;color:var(--muted);font-size:.88rem;line-height:1.5;
 border-left:2px solid var(--line);padding-left:12px}

/* ---- options ---- */
.opts{display:flex;flex-direction:column;gap:var(--ogap)}
.opt{display:block;width:100%;margin:0;text-align:left;background:var(--surface);
 border:1px solid transparent;border-radius:var(--radius);padding:var(--opad);
 color:var(--text);font:inherit;font-size:var(--osize);cursor:pointer;
 transition:background .16s ease,border-color .16s ease,opacity .16s ease}
.opt:hover:not(.locked){background:var(--surface-hi)}
.opt.locked{cursor:default}
.line{display:flex;gap:12px;align-items:flex-start;line-height:1.4}
.line .k{color:var(--muted);min-width:1.25em}
.line .t{flex:1}
.line .mark{font-size:1.05rem;line-height:1.45;min-width:1.05em;text-align:right;opacity:0}

/* GRAYSCALE-SAFE STATES — three signals, never colour alone: the ✓/✕ glyph, the WORD in
   .lab, and luminance (bright solid border vs dimmed dashed). Turn the display to
   grayscale and every state still reads. */
.opt.is-right{background:var(--surface-hi);border-color:var(--right);
 box-shadow:inset 0 0 0 1px var(--right)}
.opt.is-right .mark{opacity:1;color:var(--right)}
.opt.is-wrong{background:transparent;border-style:dashed;border-color:var(--wrong);
 opacity:.8}
.opt.is-wrong .mark{opacity:1;color:var(--wrong)}
.opt.is-muted{opacity:.42}

/* THE FEEDBACK LIVES INSIDE THE CARD, as Gemini's does — that is what he asked for, and it
   is also why nothing has to scroll: the explanation appears where he is already looking.
   The 0fr→1fr grid trick animates an unknown height with no JS measuring. If a browser
   refuses to animate it, the row still ends at 1fr, so the text is visible either way. */
.rat{display:grid;grid-template-rows:1fr;opacity:1}
.rat>.ratin{overflow:hidden;min-height:0}
.opt.fresh .rat{animation:reveal .3s ease}
@keyframes reveal{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
.lab{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600;
 margin:9px 0 0;padding-left:calc(1.25em + 12px)}
.opt.is-right .lab{color:var(--right)}
.opt.is-wrong .lab{color:var(--wrong)}
.why{margin:4px 0 0;padding-left:calc(1.25em + 12px);color:var(--muted);
 font-size:.86rem;line-height:1.4}

.opt.enter,.qhead.enter{animation:fadein .24s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---- NATURALREADER READS THE DOM, NOT THE SELECTION — and that is the rule that matters
        (08-18, corrected the same day) ----
   The first version of this shipped on the theory that the extension speaks whatever is
   selected, so making a thing unselectable would silence it. THAT IS WRONG and the page
   proved it: it read the chapter title and `1 / 14` off an untouched, unselectable header.

   ITS `Play` MODE WALKS THE DOM FROM THE TOP. Read out of the extension's own content
   script (`injected/nr-ext-text-processor/html-doc.js`, v7.0.12), it finds blocks of text,
   and BEFORE it collects the words it hides every element matching one selector list:

     select, textarea, button, label, audio, video, dialog, embed, menu, nav, noframes,
     noscript, object, script, style, svg, aside, footer, #footer, .no-read-aloud, …

   Two things fall out of that list and they are the entire fix:

   1. **`button` is in it**, so every option was invisible to the reader — an option was a
      `<button>`. That is why it read the question and then stopped. The options are now
      `role="button"` divs. Nothing else about them changed.
   2. **`.no-read-aloud` is in it**, and it is a plain class — an opt-out written for exactly
      this. It is on the bar title, the whole `.meta` line, and the ✓ / ✕ glyphs. Those are
      the three things he asked to go quiet, and they now go quiet at the source rather than
      by being hard to select.

   SELECTION IS STILL WORTH GETTING RIGHT, for the other half of the extension — Highlight
   to Read reads a selection, and he copies wording out to search it. So the rules below
   stay, and they line up with the list above: what you can select is what gets read. */

/* ---- SELECTABLE TEXT = WHAT A SCREEN READER SHOULD SAY (08-18, his ask) ----
   Select the card, press play on Highlight to Read, and what comes out has to be the
   question and the four options and nothing else. The rule is "what is worth hearing":

   SELECTABLE: the question, every option (answered or not), the rationale, the hint, the
   study sheet. Drag across the card and that is exactly what you get.

   NOT SELECTABLE: the chapter title in the bar and the whole .meta line — the `1 / 14`
   counter, `2nd pass`, the section, the topic, the source. All of it is chrome, and a reader
   that opens with "eleven point one interactions of skeletal muscles, one slash fourteen"
   buries the question. The ✓ / ✕ marks go too, for the same reason: they are read as
   "check mark" and "multiply", which is noise where a glyph was meant.

   THE OPTIONS USED TO STAY LOCKED UNTIL HE HAD ANSWERED, and that was not superstition.
   An option IS the button — drag across one and the mouseup answers the question with
   whatever the drag started on. Selection is on for all of them now, and the guard moved
   into JS instead: `question()` refuses a click that came at the end of a drag or that
   lands with text selected inside that same option. See THE DRAG GUARD there. */
.q,.qq,.why,.lab,.hinttext,.rline,.tag,.sheet,.topics,.legend{
 user-select:text;-webkit-user-select:text}
.opt,.opt *{user-select:text;-webkit-user-select:text}
.opt.locked{cursor:auto}
.line .mark,.lab .g{user-select:none;-webkit-user-select:none}
.title,.meta,.meta *{user-select:none;-webkit-user-select:none}
.star,.dots,.tab,button.pill{user-select:none;-webkit-user-select:none}

/* ---- HIS RESEARCH, one box per question ----
   Under the options, inside the band, and OUTSIDE #quizview — so answering re-renders the
   question without touching what he is halfway through typing, the same reason the hint
   lives in the footer.

   THE TOGGLE ROW IS ALWAYS VISIBLE AND THE BODY IS WHAT COLLAPSES. That is what keeps the
   centring honest: the block's minimum height is a constant the measurement can include,
   whether the box is open or shut. Opening it only ever grows the page downward, which is
   the one direction this page allows. */
.research{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.rtoggle{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;
 color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline;
 text-underline-offset:3px;user-select:none;-webkit-user-select:none}
.rtoggle:hover{color:var(--text)}
.rtoggle.has{color:var(--text)}
.rbody{margin:12px 0 0}
/* ONE BOX, THREE PANES, AND ONLY ONE ON SCREEN (08-16, his ask). They used to sit side by
   side at half width each, which was already tight for a pasted paragraph — a third one
   would have made each a third of 660px. His words: *"just one textbox … but when I press r
   it opens it for research, when I click off the box and on the main page and press f, it
   opens another textbox in the similar area."* So the pane is chosen by a key or a chip and
   the box is FULL WIDTH whichever one is showing.
   All three textareas stay in the DOM and only the hidden ones are display:none — every
   flush reads all three `.value`s at once, so switching panes cannot lose a keystroke. */
.rtabs{display:flex;gap:5px;margin:0 0 9px;flex-wrap:wrap}
.rtab{background:none;border:1px solid transparent;color:var(--muted);font:inherit;
 font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;
 border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
 user-select:none;-webkit-user-select:none}
.rtab:hover{color:var(--text);background:var(--surface)}
.rtab[aria-selected="true"]{color:var(--text);border-color:var(--line);
 background:var(--surface-hi)}
.rtab kbd{font:inherit;font-size:.68rem;text-transform:none;letter-spacing:0;line-height:1;
 padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
/* A pane with something in it says so without being opened. A DOT, not a colour change, so
   it reads in grayscale like every other state on this page. */
.rtab i{width:5px;height:5px;border-radius:999px;background:var(--text);opacity:0}
.rtab.has i{opacity:1}
.rpane{width:100%;min-height:132px;resize:vertical;background:var(--surface);
 color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
 padding:11px 13px;font:inherit;font-size:.9rem;line-height:1.55;outline:none}
.rpane.hide{display:none}
.rpane:focus{border-color:var(--accent)}
.rpane::placeholder{color:var(--muted);opacity:.7}
.rshots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.shot{position:relative;display:block;line-height:0}
.shot img{max-height:88px;max-width:150px;border-radius:9px;border:1px solid var(--line)}
.shot .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;line-height:18px;
 text-align:center;border-radius:999px;border:1px solid var(--line);background:var(--surface-hi);
 color:var(--text);font:inherit;font-size:.8rem;cursor:pointer;padding:0}
.rsay{color:var(--muted);font-size:.76rem;margin:9px 0 0;min-height:1em}
.rsay.warn{color:var(--wrong)}

/* A reflection printed under its question on the Starred tab. Indented off a rule so it
   reads as HIS writing rather than as another line of the question's record. */
.rtxt.refl{border-left:2px solid var(--line);padding:2px 0 2px 13px;margin:12px 0 0}
.rtxt.refl ul,.rtxt.refl ol{margin:0 0 0 18px;padding:0}
.rtxt.refl li,.rtxt.refl p{color:var(--muted);font-size:.9rem;margin:0 0 4px}
kbd{font:inherit;font-size:.78rem;line-height:1;padding:2px 5px;border:1px solid var(--line);
 border-radius:5px;background:var(--surface)}

/* the same material, read back on the study sheet */
.ritem{border-top:1px solid var(--line);padding:16px 0 4px}
.ritem:first-of-type{border-top:0;padding-top:6px}
.rq{font-size:.95rem;font-weight:600;margin:0 0 8px}
.rans{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.rtxt p{margin:0 0 9px;color:var(--muted)}
.rimg{display:block;max-width:100%;border-radius:10px;border:1px solid var(--line);
 margin:0 0 10px}

/* ---- starring ----
   A visible toggle rather than a menu item: it is used on questions he got RIGHT as often as
   wrong, so it has to be one press. Outline vs filled is a shape difference, so it reads in
   grayscale without needing colour. */
.star{background:none;border:0;color:var(--muted);font-size:1.05rem;line-height:1;
 padding:4px 6px;border-radius:999px;cursor:pointer;flex:0 0 auto}
.star:hover{background:var(--surface);color:var(--text)}
.star.on{color:var(--text)}

/* ---- ? "no idea, needs work" ----
   Beside the star and read the same way. GRAYSCALE-SAFE like everything else on this page:
   on/off is a RING appearing, not a colour changing, so it reads with the colour off and at
   a glance in a screenshot. */
.qmark{background:none;border:1px solid transparent;color:var(--muted);font:inherit;
 font-size:.9rem;font-weight:600;line-height:1;width:26px;height:26px;padding:0;
 border-radius:999px;cursor:pointer;flex:0 0 auto;user-select:none;-webkit-user-select:none}
.qmark:hover{background:var(--surface);color:var(--text)}
.qmark.on{color:var(--text);border-color:var(--accent);background:var(--surface-hi)}

/* ---- the ⋮ menu ---- */
.more{position:relative;flex:0 0 auto}
.dots{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;
 padding:4px 8px;border-radius:999px;cursor:pointer}
.dots:hover{background:var(--surface);color:var(--text)}
.menu{position:absolute;right:0;top:32px;background:var(--surface-hi);
 border:1px solid var(--line);border-radius:10px;padding:5px;min-width:170px;z-index:6;
 box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;
 color:var(--text);font:inherit;font-size:.88rem;padding:8px 10px;border-radius:7px;
 cursor:pointer;white-space:nowrap}
.menu button:hover{background:var(--surface)}

/* ---- READ ALOUD — the page's own voice (08-20) --------------------------------------
   THE WHOLE WIDGET IS CHROME, so every part of it carries `.no-read-aloud` and is a real
   `<button>` wherever it can be one. NaturalReader must never read the controls of the
   reader that replaced it, and `<button>` is on its ignore list for free.

   `tabindex="-1"` on every control, for the clock's reason: Enter means "next question"
   everywhere on this page, and a focusable control down here would swallow it. */
.reader{position:relative;display:flex;align-items:center;flex:0 0 auto;
 gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);
 background:var(--surface);user-select:none;-webkit-user-select:none}
.reader.on{border-color:var(--accent)}
.reader button{background:none;border:0;color:var(--muted);font:inherit;font-size:.78rem;
 line-height:1;padding:6px 7px;border-radius:999px;cursor:pointer}
.reader button:hover{background:var(--surface-hi);color:var(--text)}
.reader .rate{font-variant-numeric:tabular-nums;min-width:24px}
.reader .play{width:29px;height:29px;padding:0;font-size:.74rem;background:var(--surface-hi);
 color:var(--text)}
.reader.on .play{background:var(--accent);color:#0b0b0c}

/* ---- the voice panel ----
   Same furniture as the ⋮ menu, one size up, because it is the same kind of thing: a small
   stack of settings hanging off a control. */
/* OPENS UPWARD FROM THE BUTTON THAT OPENED IT — absolute inside `.reader`, which is the
   same relationship the ⋮ menu has with its own dots. SCROLLS RATHER THAN RUNNING OFF THE
   TOP: on a short window the panel is taller than the gap above the footer, and a settings
   panel whose first control is off-screen is worse than a scrollbar. */
.vset{position:absolute;left:0;bottom:44px;z-index:8;width:296px;padding:14px 16px 15px;
 border-radius:14px;border:1px solid var(--line);background:var(--surface-hi);
 box-shadow:0 12px 30px rgba(0,0,0,.55);
 max-height:calc(100vh - 130px);overflow-y:auto}
.vset .vhead{display:flex;align-items:center;justify-content:space-between;
 font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
 margin:0 0 10px}
.vset .vx{background:none;border:0;color:var(--muted);font:inherit;font-size:.8rem;
 padding:2px 4px;cursor:pointer;border-radius:5px}
.vset .vx:hover{background:var(--surface);color:var(--text)}
.vset select{width:100%;font:inherit;font-size:.86rem;color:var(--text);
 background:var(--surface);border:1px solid var(--line);border-radius:8px;
 padding:8px 9px;margin:0 0 4px}
.vset .vrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
 font-size:.82rem;color:var(--muted);margin:13px 0 4px}
/* The number never wraps and never gets squeezed into the label — the label is the half
   that gives way, because a slider with an unreadable value is not a slider. */
.vset .vrow b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;
 font-size:.8rem;flex:0 0 auto;white-space:nowrap}
.vset input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.vset .vchk{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);
 margin:14px 0 0;cursor:pointer}
.vset .vchk input{accent-color:var(--accent);margin:0}
.vset .vtest{display:block;width:100%;margin:13px 0 0;font:inherit;font-size:.82rem;
 color:var(--text);background:var(--surface);border:1px solid var(--line);
 border-radius:8px;padding:8px;cursor:pointer}
.vset .vtest:hover{border-color:var(--muted)}
/* ONE KEY PER LINE. This is the only place on the page that says what Space and the arrows
   do, so it has to be readable at a glance rather than a wrapped run-on of separators. */
.vset .vkeys{margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line);
 display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:baseline;
 font-size:.75rem;color:var(--muted)}
.vset .vkeys kbd{font-size:.7rem;padding:1px 5px;justify-self:start}
.vset .vkeys span{justify-self:start}
.vset .vnote{margin:9px 0 0;font-size:.72rem;line-height:1.5;color:var(--muted);opacity:.8}

/* WHAT IS BEING READ, MARKED WITHOUT MOVING ANYTHING. Every other highlight on this page
   is a border or a ring for the same reason: the question is centred once and frozen, so a
   mark that changed a box's height would drag the whole card under him mid-sentence. An
   option already has a 1px border to recolour; the question gets an underline, which is the
   one decoration that costs no layout at all. */
.opt.speaking{border-color:var(--accent)}
.q .sp.speaking{text-decoration:underline;text-decoration-color:var(--accent);
 text-decoration-thickness:2px;text-underline-offset:7px}

/* ---- bottom bar ---- */
footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
 padding:8px 0 10px}
.acts{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
button.pill{font:inherit;font-size:.9rem;border-radius:999px;padding:9px 22px;
 cursor:pointer;border:1px solid var(--line);background:none;color:var(--text)}
button.pill:disabled{opacity:.32;cursor:default}
button.pill.primary{background:var(--accent);color:#0b0b0c;border-color:var(--accent);
 font-weight:500}
button.pill.ghost{border-color:transparent;color:var(--muted)}

/* ---- end card ---- */
.score{font-size:3.1rem;font-weight:400;letter-spacing:-.03em;margin:0}
.score small{font-size:.95rem;color:var(--muted);font-weight:400;letter-spacing:0}
.sub{color:var(--muted);margin:5px 0 26px;font-size:.92rem}
.chart{display:flex;height:11px;border-radius:999px;overflow:hidden;
 background:var(--line);margin:0 0 9px}
.chart i{display:block;height:100%}
.chart i.r{background:var(--right)}
/* hatched as well as coloured, so the split reads with the colour off */
.chart i.w{background:var(--wrong);
 background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,
 rgba(0,0,0,.45) 3px,rgba(0,0,0,.45) 6px)}
.legend{display:flex;gap:16px;color:var(--muted);font-size:.84rem;margin:0 0 30px}
.legend b{color:var(--text);font-weight:500}
.topics{margin:0 0 30px}
.topics h3,.rev h3{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
 color:var(--muted);font-weight:500;margin:0 0 12px}
.trow{display:grid;grid-template-columns:1fr auto;gap:5px 14px;align-items:center;
 padding:8px 0;border-top:1px solid var(--line)}
.trow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
.tbar{grid-column:1/-1;height:3px;background:var(--line);border-radius:999px;
 overflow:hidden}
.tbar i{display:block;height:100%;background:var(--text)}
/* A subchapter he has not sat gets a rail with nothing in it rather than a 0% bar, because a
   bar at zero reads as "scored nothing" and the whole point is that it has not been asked. */
.tbar.waiting{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.topics.parts .trow em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:8px}
.ptotal{margin:14px 0 0;color:var(--muted);font-size:.88rem}
.ptotal b{color:var(--text);font-variant-numeric:tabular-nums;font-size:1.05rem;
 font-weight:600;margin-right:8px}

/* ---- MOMENTUM (08-21) ----
   Same furniture as every other end-card table — same heading, same hairline rows, same
   rails — because it is one more breakdown of the same sitting and must not read as a
   dashboard bolted on. The only new shape is the strip, and it is deliberately small: it is
   there to be glanced at, not measured off.

   IT READS IN GRAYSCALE. A wrong bar is HATCHED as well as coloured, exactly like the wrong
   half of the score chart above it, so the split survives a screenshot with the colour gone
   and survives him printing it. */
.mom .strip{display:flex;align-items:flex-end;gap:2px;height:56px;position:relative;
 margin:0 0 5px;padding-top:2px}
.mom .strip .sb{flex:1 1 0;min-width:2px;border-radius:2px 2px 0 0;background:var(--text)}
.mom .strip .sb.r{background:var(--right)}
.mom .strip .sb.w{background:var(--wrong);
 background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,
 rgba(0,0,0,.45) 3px,rgba(0,0,0,.45) 6px)}
/* The median, drawn across the strip rather than written under it — the whole question the
   strip answers is "which of these are the long ones", and a line answers it at a glance. */
.mom .strip .med{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--muted);
 opacity:.55;pointer-events:none}
.momax{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;
 letter-spacing:.04em;margin:0 0 16px}
.mline{color:var(--muted);font-size:.88rem;margin:0 0 18px}
.mline b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}
.mrow{display:grid;grid-template-columns:1.1em 1.7em 1fr auto;gap:5px 10px;align-items:center;
 padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.mrow .mg{color:var(--muted);font-size:.85rem;user-select:none;-webkit-user-select:none}
.mrow .mn{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;text-align:right}
.mrow .mlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mt{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
/* The rail is `.tbar`, borrowed whole from the tables above. `i.w` is the only addition:
   time on a question he got wrong gets the same hatch as everything else wrong on the page. */
.mrow .tbar i.w{background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,
 rgba(0,0,0,.45) 3px,rgba(0,0,0,.45) 6px)}
.mmore{margin:12px 0 0;font-size:.85rem}
.mgoal{margin:16px 0 0;color:var(--muted);font-size:.88rem;max-width:52ch}
.mgoal b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}

/* ---- THE SUBCHAPTER PICKER (08-16) ----
   Deliberately the same furniture as the end card — same heading treatment, same rails, same
   tabular numbers — because it IS the end card most of the time he sees it: he opens the link
   and this screen tells him what he has scored and what is left. A separate visual language
   for "choose" and "review" would make one screen look like two. */
.picker{padding:2px 0 8px}
.picker h3{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
.psub{color:var(--muted);font-size:.9rem;margin:0 0 22px;max-width:46ch}
.pscore{margin:0 0 22px}
.pscore b{font-size:1.5rem;font-variant-numeric:tabular-nums;font-weight:600}
.pscore span{color:var(--muted);font-size:.88rem;margin-left:10px}
.prows{display:flex;flex-direction:column;gap:8px;margin:0 0 24px}
.prow{display:grid;grid-template-columns:22px auto 1fr;gap:4px 12px;align-items:center;
 width:100%;text-align:left;font:inherit;cursor:pointer;padding:13px 16px;
 border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.prow:hover{border-color:var(--muted)}
.prow.pon{border-color:var(--accent)}
.pmark{color:var(--accent);font-size:.95rem;line-height:1}
.plabel{font-variant-numeric:tabular-nums;font-weight:600}
.plabel em{font-style:normal;font-weight:400;color:var(--muted);margin-left:8px}
.pnote{color:var(--muted);font-size:.86rem;justify-self:end}
.pbar{grid-column:2/-1;height:3px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--text)}
.pgo{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
button.pill.go{background:var(--accent);color:#0b0b0c;border-color:var(--accent)}

/* ---- review list ---- */
.rev{padding:6px 0 36px}
.item{border-top:1px solid var(--line);padding:20px 0}
.item .qq{font-size:1rem;margin:0 0 12px}
/* The Starred tab's own header note and count, which the study sheet styles under `.own`. */
.rev > .say{color:var(--muted);font-size:.85rem;margin:0 0 4px;max-width:62ch}
.rev h3 .say{text-transform:none;letter-spacing:0;font-size:.72rem;color:var(--muted)}
.rline{display:flex;gap:10px;align-items:flex-start;padding:3px 0;font-size:.92rem}
.rline .g{min-width:1.2em}
.rline.mine{color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
 color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;
 margin:0 0 9px}

/* ---- study sheet ----
   THREE DISTINCT LEVELS, because two of them used to look the same: he could not tell the
   topic from the "Key terms" heading under it. Topic = large, over a rule. Key terms /
   Names and studies = a small uppercase label, the same treatment the quiz gives its topic
   tag. Entries = a numbered list with the term in bold, which is the shape of his own
   Notion notes, so his shorthand sits beside this instead of clashing with it. */
.sheet{padding:2px 0 56px;font-size:.95rem}
.sheet h2{font-size:1.3rem;font-weight:600;margin:34px 0 10px;letter-spacing:-.01em}
.sheet h3{font-size:1.15rem;font-weight:600;margin:34px 0 4px;letter-spacing:-.01em;
 padding-top:18px;border-top:1px solid var(--line)}
/* first-of-type, not first-child: .sheettools is the first child, so first-child never
   matched and the opening topic carried a stray rule above it */
.sheet h3:first-of-type{margin-top:0;padding-top:0;border-top:0}
.sheet h4,.sheet h5{font-size:.7rem;font-weight:600;margin:18px 0 8px;color:var(--muted);
 letter-spacing:.09em;text-transform:uppercase}
.sheet p{margin:0 0 10px;color:var(--muted)}
.sheet h3+p{color:var(--text);margin-bottom:4px}
.sheet ul,.sheet ol{margin:0 0 4px;padding-left:24px}
.sheet ol{list-style:decimal}
.sheet ol ol{list-style:lower-alpha;margin:4px 0 6px}
.sheet ul ul,.sheet ol ul{margin:4px 0 6px}
.sheet li{margin:0 0 6px;padding-left:2px}
.sheet li::marker{color:var(--muted)}
.sheet li>strong:first-child{color:var(--text)}
.sheet strong{font-weight:600}
.sheet hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.sheet code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.9em}
.sheettools{display:flex;justify-content:flex-end;gap:18px;padding:10px 0 4px}
.copied{color:var(--right)}

/* ---- the score, on the sheet ----
   It sits at the top of the sheet and Copy takes it, so the paste that lands in the Notion
   row carries what he scored beside what the section says — which is what tells him later
   whether this one needs testing again. */
.scorecard{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
 margin:16px 0 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.scorecard b{font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.scorecard span{color:var(--muted);font-size:.88rem}
/* Its own row under the score, never beside it — the projected number is a second reading
   of the same quiz and putting it inline would read as more of the first one. */
.scorecard .proj{flex-basis:100%;padding-top:2px;border-top:1px solid var(--line);
 margin-top:4px;font-size:.84rem}

/* ---- his own additions ---- */
/* SCOPED TO .sheet, because `.mine` is also the review list's "you chose this" modifier
   (`.rline.mine`) and this block sits later in the file — unscoped, it was handing every
   wrong-answer line in the review list a 34px gap and a rule above it. */
.own{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--line)}
/* HIS BOX IS FIRST ON THE SHEET (08-19, his ask): "my own section to write down any missing
   notes". A rule above the first thing on the page has nothing to separate it from, so it
   moves down onto the book's material, which now follows him instead of preceding him. */
.own.first{margin-top:6px;padding-top:0;border-top:0}
#sheetmd{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.own h3{margin:0 0 4px;padding:0;border:0}
.own .say{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.own .item:first-of-type{border-top:0;padding-top:6px}
#mynotes{width:100%;min-height:180px;resize:vertical;background:var(--surface);
 color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
 padding:14px 16px;font:inherit;font-size:.95rem;line-height:1.6;outline:none}
#mynotes:focus{border-color:var(--accent)}
#mynotes::placeholder{color:var(--muted);opacity:.7}
.saved{color:var(--muted);font-size:.78rem;margin:8px 0 0;height:1em}
#minepreview{margin:14px 0 0}

/* ---- the exam's two extra tags, and the written half ----
   The section and the glyph ride the existing .meta line rather than becoming chips of their
   own: they belong with the counter and the topic, which is already the line that says what
   you are looking at. Colour is not used to tell the five glyphs apart — each one IS a
   distinct character, so the page stays readable in grayscale without a legend. */
.meta .sec{color:var(--text)}
/* The second section on a cross-section question. Smaller and dimmer than the first, because
   the first is where the question is filed and this one says what it also reaches into. */
.meta .lk{color:var(--muted);font-size:.9em;margin-left:1px}
.meta .src{font-size:.85rem;line-height:1;text-transform:none;letter-spacing:0;cursor:help}

.frqs{padding:2px 0 56px}
.frqs > .say{color:var(--muted);font-size:.88rem;margin:0 0 26px;max-width:60ch}
.frq{margin:0 0 42px;padding:0 0 34px;border-bottom:1px solid var(--line)}
.frq:last-child{border-bottom:0;padding-bottom:0}
.frq .q{font-size:1.08rem;line-height:1.45;font-weight:600;margin:0 0 6px}
.frq .say{color:var(--muted);font-size:.84rem;margin:6px 0 0}
.stim{margin:0 0 14px;padding:11px 16px;background:var(--surface);
 border-left:2px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;
 font-size:.95rem;line-height:1.55;color:var(--text)}
.frqin{width:100%;min-height:190px;resize:vertical;background:var(--surface);
 color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
 padding:14px 16px;font:inherit;font-size:.95rem;line-height:1.6;outline:none;margin-top:16px}
.frqin:focus{border-color:var(--accent)}
/* THE STICKY HEADER WAS EATING THE CLICK (08-16). It is 49px tall with z-index 5, so the top
   strip of a box scrolled under it is dead to the mouse — and the top strip is exactly where
   the "Write your answer." placeholder is, so the box reads as broken. His words: *"I cant
   even click the textbox for this exam."* `scroll-margin-top` keeps the card clear of the
   header whenever anything scrolls it into view; the click handler on the card is the belt to
   that braces, since he can also scroll there by hand. */
.frq{scroll-margin-top:64px}

/* The only thing on this page allowed to shout. It sits over everything because a saved
   answer is the one promise the page makes. */
#savewarn{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;padding:12px 16px;
 border-radius:12px;font-size:.86rem;line-height:1.4;background:#7f1d1d;color:#fff;
 box-shadow:0 6px 24px rgba(0,0,0,.4)}
#savewarn.hide{display:none}

/* WHERE FORWARD MEANS "THE NEXT BLANK ONE". Reaching the end of the list with holes in it
   sends him back to the first one — right, and invisible until 08-16, when he read it as the
   paper losing his place: *"when I thought I was done I wasnt… questions are ghosting until
   the end."* The counter says so now, and the rail stops pretending the run is nearly over. */
.fillnote{display:inline-flex;align-items:center;gap:6px;color:var(--accent);
 font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}
.frqin::placeholder{color:var(--muted);opacity:.7}
.acts.inline{margin-top:12px}
.rubric{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.rubric h3{margin:0 0 10px;padding:0;border:0;font-size:.7rem;letter-spacing:.09em;
 text-transform:uppercase;color:var(--muted)}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;margin:0 -10px;
 border-radius:10px;cursor:pointer}
.rrow:hover{background:var(--surface)}
.rmark{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);
 display:grid;place-items:center;font-size:.78rem;background:var(--surface);
 color:var(--muted);margin-top:2px}
.rrow.hit .rmark{border-color:var(--right);color:var(--right)}
.rbody{flex:1;min-width:0}
.rlab{font-size:.93rem;line-height:1.45;color:var(--muted)}
.rrow.hit .rlab{color:var(--text)}
.rnote{display:block;font-size:.78rem;color:var(--muted);opacity:.85;margin-top:2px}
.judge{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
 border:1px solid var(--accent);border-radius:999px;padding:1px 7px;margin-left:7px;
 white-space:nowrap;vertical-align:1px}
.rfoot{display:flex;align-items:baseline;gap:14px;margin-top:16px;padding-top:14px;
 border-top:1px solid var(--line)}
.rscore{font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.rscore small{color:var(--muted);font-size:.75em;font-weight:400}
.rverdict{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.model{margin-top:14px;background:var(--surface);border-radius:var(--radius);
 padding:14px 16px;font-size:.9rem;line-height:1.65;color:var(--muted)}
.model strong{color:var(--text)}

.empty{color:var(--muted);padding:8px 0 30px}
.hist{color:var(--muted);font-size:.84rem;margin:22px 0 0}
.hist span{white-space:nowrap}
.note{color:var(--muted);font-size:.84rem;margin:16px 0 0}
.hide{display:none !important}

@media (max-width:640px){
  .wrap{padding:0 16px}
  .q{font-size:1.22rem}
  main{padding:22px 0 14px}
  .score{font-size:2.5rem}
  .bar{gap:8px}
  .tab{padding:5px 10px}
  button.pill{padding:11px 18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}


.head{padding:56px 0 34px}
.head h1{font-size:2rem;font-weight:400;letter-spacing:-.02em;margin:0}
.head p{color:var(--muted);margin:8px 0 0}
.book{margin:0 0 40px}
.book h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
 font-weight:500;margin:0 0 4px}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;
 border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover .nm{color:var(--accent)}
.nm{flex:1;font-size:1.02rem}
.nm small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.badge{font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap;
 border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.badge.done{border-color:var(--text)}
.badge.none{color:var(--muted)}
.mini{width:70px;height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--text)}
.empty{color:var(--muted);padding:30px 0}
.foot{color:var(--muted);font-size:.85rem;padding:10px 0 60px;border-top:1px solid var(--line)}
@media (max-width:640px){
  .head{padding:34px 0 24px}
  .mini{display:none}
  .row{gap:12px}
}

</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>My quizzes</h1>
    <p id="tally"></p>
  </div>
  <div id="list"></div>
  <p class="foot">Scores are saved in this browser. A quiz taken on your phone keeps its

<script>
const M = JSON.parse(document.getElementById('manifest').textContent);
const esc = t => { const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; };

function state(id){
  try{ return JSON.parse(localStorage.getItem('lq:'+id) || 'null'); }catch(e){ return null; }
}
function when(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

const books = {};
M.forEach(q => { (books[q.book] = books[q.book] || []).push(q); });

let taken = 0, total = 0;
let h = '';
Object.keys(books).forEach(b => {
  h += '<div class="book"><h2>' + esc(b) + '</h2>';
  books[b].forEach(q => {
    const s = state(q.id);
    const done = s && s.done;
    const n = done ? (s.meta ? s.meta.score : 0) : 0;
    const t = q.total;
    if(done) taken++;
    total++;
    const tries = s && s.history ? s.history.length + (done ? 1 : 0) : 0;
    let sub = q.subtitle || '';
    if(done){
      sub = when(s.at) + (tries > 1 ? ' · ' + tries + ' attempts' : '') + (sub ? ' · ' + sub : '');
    } else if(s && Object.keys(s.answers||{}).length){
      sub = 'In progress — ' + Object.keys(s.answers).length + ' of ' + t + (sub ? ' · ' + sub : '');
    }
    h += '<a class="row" href="' + q.url + '">'
       + '<span class="nm">' + esc(q.title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>'
       + (done ? '<span class="mini"><i style="width:' + (n/t*100) + '%"></i></span>' : '')
       + '<span class="badge ' + (done ? 'done' : 'none') + '">'
       + (done ? n + ' / ' + t : 'Not taken') + '</span></a>';
  });
  h += '</div>';
});

document.getElementById('list').innerHTML = h || '<p class="empty">Nothing built yet.</p>';
document.getElementById('tally').textContent =
  total ? taken + ' of ' + total + ' taken in this browser' : '';
</script>
